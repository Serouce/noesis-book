"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "pnpm run build"
  publish = "dist"
  environment = { NODE_VERSION = "22" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/v10/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/v9/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/v8/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/v7/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
